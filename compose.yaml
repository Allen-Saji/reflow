services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - "127.0.0.1:6388:6379"
    environment:
      BROWSER: "0"
      FALKORDB_DATA_PATH: "/data"
      REDIS_ARGS: "--appendonly yes --appendfsync always --dir /data --maxmemory-policy noeviction"
    volumes:
      - falkordb-data:/data
    restart: unless-stopped
volumes:
  falkordb-data:
